# Clippy configuration
msrv = "1.70"
allow-dirty = false
allow-staged = false
allow-untracked = false

# Allowed lints that we consider acceptable for this project
allow = []

# Denied lints that we want to treat as errors
deny = []

# Warn about these lints
warn = [
    "clippy::all",
    "clippy::pedantic",
    "clippy::nursery",
]

# Allow some lints that are too strict for our use case
allow = [
    "clippy::new-without-default", # We prefer explicit constructors
    "clippy::should-implement-trait", # Sometimes custom methods are clearer
    "clippy::useless-format", # Sometimes format! is clearer
]


